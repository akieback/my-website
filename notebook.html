<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notebook · Adrian Kieback</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0c1922">
  <link rel="icon" href="icons/mark.svg" type="image/svg+xml">
  <link rel="alternate icon" href="icons/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <link rel="stylesheet" href="assets/css/site.css">
  <script>document.documentElement.classList.add("js")</script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.12/marked.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script defer src="assets/js/site.js"></script>
  <script defer src="assets/js/notebook.js"></script>
</head>
<body data-page="notebook">
<main id="main">
  <header class="page-head">
    <canvas aria-hidden="true"></canvas>
    <div class="wrap">
      <p class="eyebrow">Notebook</p>
      <h1>Field <em>notes.</em></h1>
      <p class="lede">A private log of what I'm learning, so future me can retrace the route.</p>
    </div>
  </header>

  <section class="section">
    <div class="wrap">
      <div class="lock" id="lock">
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="14" y="28" width="36" height="28" rx="5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M22 28v-8a10 10 0 0 1 20 0v8" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M24 44c2.7-2.6 5.3-2.6 8 0s5.3 2.6 8 0" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        <h2 style="font-size:1.6rem">This part is just for me.</h2>
        <p class="muted">The notes are encrypted. Enter the passphrase to read them.</p>
        <form id="unlock" autocomplete="off">
          <label for="pass" class="sr-only">Passphrase</label>
          <input id="pass" type="password" placeholder="passphrase" required autocomplete="current-password">
          <button class="btn btn-solid" type="submit">Unlock</button>
        </form>
        <p class="err" id="err" role="alert"></p>
      </div>

      <div class="nb" id="nb" hidden>
        <div class="nb-side">
          <input type="search" id="nb-search" placeholder="search notes…" aria-label="Search notes">
          <ul class="nb-list" id="nb-list"></ul>
          <p style="margin-top:18px"><button class="btn" type="button" id="lock-again">lock</button></p>
        </div>
        <article class="nb-article prose" id="nb-article"></article>
      </div>
    </div>
  </section>
</main>
</body>
</html>
