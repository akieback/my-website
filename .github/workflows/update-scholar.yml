name: Update Google Scholar stats

on:
  schedule:
    - cron: "17 6 * * *"  # daily, 06:17 UTC
  workflow_dispatch:       # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch Scholar metrics
        run: python scripts/update_scholar.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/scholar.json && ! git ls-files --others --exclude-standard -- data | grep -q .; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scholar.json
          git commit -m "Update Google Scholar stats"
          git push
